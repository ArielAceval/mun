<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="menu-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="mun-logo-title">MUN</ion-title>
    <ion-buttons slot="end">
      <ion-button class="notif-btn">
        <ion-icon name="notifications-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
        <span class="notif-badge">1</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" style="--background:#fdfaf5;">
  <div class="tips-wrapper">

    <!-- Logo circular -->
    <div class="logo-circle">MUN</div>

    <!-- Título -->
    <h1 class="page-title">TIPS DE TU HERMANA MAYOR VIRTUAL, MUNI</h1>

    <!-- Acordeones -->
    <div class="accordion" *ngFor="let ac of acordeones; let i = index">
      <button class="accordion-header" (click)="toggleAcordeon(i)">
        <span>{{ ac.icon }} {{ ac.titulo }}</span>
        <span class="accordion-arrow">{{ ac.open ? '▲' : '▼' }}</span>
      </button>
      <div class="accordion-body" *ngIf="ac.open">
        <div class="acordeon-subtitulo">{{ ac.subtitulo }}</div>
        <div class="acordeon-muni">MUNI te sugiere: "{{ ac.sugerencia }}"</div>
        <div class="acordeon-icon" *ngIf="ac.bodyIcon">{{ ac.bodyIcon }}</div>
        <button *ngIf="ac.boton" class="reservar-btn">RESERVAR</button>
      </div>
    </div>

    <!-- Banner -->
    <div class="banner">
      <p class="banner-text">MUNI TE DICE: "Acompáñala sin tabúes."</p>
      <button class="guia-btn">GUÍA DE DIÁLOGO MUN</button>
    </div>

  </div>
</ion-content>
