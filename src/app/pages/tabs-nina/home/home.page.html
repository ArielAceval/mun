<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="menu-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="mun-logo-title">MUN</ion-title>
    <ion-buttons slot="end">
      <ion-button class="notif-btn">
        <ion-icon name="notifications-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
        <span class="notif-badge">1</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" style="--background:#fdfaf5;">
  <div class="home-wrapper">

    <h1 class="page-title">Mi Ciclo</h1>

    <!-- Calendario semanal -->
    <div class="week-calendar">
      <div class="day-col" *ngFor="let d of days">
        <span class="day-label">{{ d.label }}</span>
        <div class="day-circle" [ngClass]="getDayClass(d.num)">{{ d.num }}</div>
        <div class="period-dot" [class.invisible]="!hasPeriodDot(d.num)"></div>
      </div>
    </div>

    <!-- Tarjeta Sangrado -->
    <div class="card">
      <label class="card-title">Nivel de Sangrado</label>
      <div class="slider-row">
        <span class="slider-label">Low</span>
        <input type="range" min="0" max="10" [(ngModel)]="sangrado" class="sangrado-slider"/>
        <span class="slider-label">💧💧 High</span>
      </div>
    </div>

    <!-- Tarjeta Mood -->
    <div class="card" (click)="goToRegistro()">
      <div class="card-header-row">
        <label class="card-title">Mood</label>
        <span class="arrow-right">→</span>
      </div>
      <div class="mood-row">
        <button *ngFor="let m of moods"
          class="mood-btn"
          [class.mood-selected]="selectedMood === m"
          (click)="selectMood(m); $event.stopPropagation()">
          {{ m }}
        </button>
      </div>
    </div>

    <!-- Tarjeta Suelo Pélvico -->
    <div class="card card-row">
      <span class="card-emoji-big">🧘‍♀️</span>
      <div class="card-text">
        <div class="card-title-inline">Suelo Pélvico</div>
        <div class="card-sub">Ejercicios recomendados</div>
      </div>
      <span class="arrow-right">→</span>
    </div>

    <div style="height:130px;"></div>
  </div>

  <!-- MUNI flotante -->
  <div slot="fixed" class="muni-float">
    <img src="assets/avatars/muni-avatar.png" class="muni-img" alt="Muni"/>
    <div class="muni-bubble">¿Cómo te sientes hoy?</div>
  </div>

</ion-content>
