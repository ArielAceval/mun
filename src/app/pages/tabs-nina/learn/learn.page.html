<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="menu-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="mun-logo-title">MUN</ion-title>
    <ion-buttons slot="end">
      <ion-button class="notif-btn">
        <ion-icon name="notifications-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
        <span class="notif-badge">1</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" style="--background:#fdfaf5;">
  <div class="learn-wrapper">

    <h1 class="page-title">Aprende &amp; Diviértete</h1>

    <!-- Tarjeta Videos -->
    <div class="video-card">
      <div class="video-card-header">
        <div class="video-card-title">Videos de Kinesiología</div>
        <div class="video-card-sub">Ejercicios para aliviar síntomas</div>
      </div>
      <div class="video-thumbnail">
        <span class="play-btn">▶</span>
      </div>
    </div>

    <!-- Grid 2 tarjetas medianas -->
    <div class="mid-grid">
      <div class="mid-card" style="background:#d4f5e8;">
        <span class="mid-emoji">📖</span>
        <span class="mid-title">Cuentos Animados</span>
      </div>
      <div class="mid-card" style="background:#fff4d4;">
        <span class="mid-emoji">🥗</span>
        <span class="mid-title">Nutrición para tí</span>
      </div>
    </div>

    <!-- Botón Preguntas Anónimas -->
    <button class="anon-btn">
      <span>❓</span>
      <span class="anon-label">Preguntas Anónimas</span>
    </button>

  </div>
</ion-content>
