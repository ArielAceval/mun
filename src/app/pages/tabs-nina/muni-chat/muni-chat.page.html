<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs-nina/registro" style="color:#2c3e7d;"></ion-back-button>
    </ion-buttons>
    <ion-title class="mun-logo-title">MUN</ion-title>
    <ion-buttons slot="end">
      <ion-button class="notif-btn" *ngIf="mensajeEnviado">
        <ion-icon name="notifications-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
        <span class="notif-badge">1</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-wrapper">

    <!-- Manchas acuarela SVG -->
    <svg class="watercolor-svg" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 390 700" preserveAspectRatio="xMidYMid slice">
      <defs>
        <filter id="wcmc" x="-30%" y="-30%" width="160%" height="160%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04"
                        numOctaves="4" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise"
                             scale="15" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <ellipse cx="340" cy="80" rx="130" ry="100"
               fill="#f5c5d0" opacity="0.45" filter="url(#wcmc)"/>
      <ellipse cx="30" cy="300" rx="100" ry="120"
               fill="#c8b8e8" opacity="0.4" filter="url(#wcmc)"/>
      <ellipse cx="200" cy="650" rx="180" ry="100"
               fill="#f5c5d0" opacity="0.35" filter="url(#wcmc)"/>
    </svg>

    <div class="content">

      <!-- Burbuja de chat niña -->
      <div class="burbuja-nina">{{ mensajeNina }}</div>

      <!-- Imagen MUNI -->
      <img src="assets/avatars/muni-avatar.png" class="muni-img" alt="Muni"/>

      <!-- Tarjeta inferior -->
      <div class="card-inferior">

        <div class="card-titulo">¿Preguntas para tu cuidador?</div>
        <div class="card-subtitulo">MUNI me ayuda a redactarlas.</div>

        <!-- Preguntas pre-escritas -->
        <div class="pregunta-item" *ngFor="let p of preguntasPreescritas">
          {{ p }}
        </div>

        <!-- Checkbox -->
        <div class="checkbox-row">
          <ion-checkbox [(ngModel)]="necesitaHablar" class="muni-check"></ion-checkbox>
          <span class="check-label">MUNI, dile a mi cuidador que necesito hablar</span>
        </div>

        <!-- Botón enviar -->
        <button class="enviar-btn" (click)="enviarConsejo()">
          ENVIAR A MUNI PARA CONSEJO
        </button>

      </div>
    </div>
  </div>
</ion-content>
