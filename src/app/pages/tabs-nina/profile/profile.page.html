<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="menu-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="mun-logo-title">MUN</ion-title>
    <ion-buttons slot="end">
      <ion-button class="notif-btn">
        <ion-icon name="notifications-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
        <span class="notif-badge">1</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" style="--background:#fdfaf5;">
  <div class="profile-wrapper">

    <h1 class="page-title">Para Tí</h1>

    <!-- Pictogramas del ciclo -->
    <div class="section">
      <h2 class="section-title">Pictogramas del Ciclo</h2>
      <div class="picto-grid">
        <div class="picto-item" *ngFor="let p of pictogramas">
          <span class="picto-emoji">{{ p.emoji }}</span>
          <span class="picto-label">{{ p.label }}</span>
        </div>
      </div>
    </div>

    <!-- Niñas Deportistas -->
    <div class="section">
      <h2 class="section-title">Niñas Deportistas</h2>
      <p class="section-sub">Vive tu deporte sin interrupción</p>
      <div class="sport-card">
        <div class="sport-row">
          <div class="sport-item" *ngFor="let s of deportes">
            <span class="sport-emoji">{{ s.emoji }}</span>
            <span class="sport-label">{{ s.label }}</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</ion-content>
