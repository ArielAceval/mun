<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="menu-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="mun-logo-title">MUN</ion-title>
    <ion-buttons slot="end">
      <ion-button class="notif-btn">
        <ion-icon name="notifications-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
        <span class="notif-badge">1</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <div class="registro-wrapper">

    <!-- Título -->
    <h1 class="page-title">REGISTRO DE HOY</h1>

    <!-- Calendario con navegación -->
    <div class="cal-row">
      <ion-button fill="clear" class="nav-btn">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </ion-button>
      <div class="dias-wrap">
        <div class="dia-col" *ngFor="let d of diasSemana">
          <span class="dia-label">{{ d.label }}</span>
          <div class="dia-circulo"
               [class.activo]="d.activo"
               [class.normal]="!d.activo">
            {{ d.num }}
          </div>
          <div class="periodo-dot" [class.visible]="d.periodo"></div>
        </div>
      </div>
      <ion-button fill="clear" class="nav-btn">
        <ion-icon name="chevron-forward-outline"></ion-icon>
      </ion-button>
    </div>

    <!-- Rueda Huella Dactilar del Dolor -->
    <div class="wheel-container">

      <!-- Fondo degradado -->
      <div class="wheel-bg"></div>

      <!-- Anillos concéntricos -->
      <div class="ring anillo-1"></div>
      <div class="ring anillo-2"></div>
      <div class="ring anillo-3"></div>
      <div class="ring anillo-4"></div>
      <div class="ring anillo-5"></div>

      <!-- Centro -->
      <div class="ring centro">
        <div class="centro-texto">
          <span>HUELLA</span>
          <span>DACTILAR</span>
          <span>DEL DOLOR</span>
        </div>
      </div>

      <!-- Sección coloreada (dolor registrado) -->
      <div class="dolor-arco"></div>

      <!-- Pétalos en el anillo exterior -->
      <div *ngFor="let angle of petalAngles"
           class="petalo-wrap"
           [style.transform]="'rotate(' + angle + 'deg)'">
        <span class="petalo" [style.transform]="'rotate(-' + angle + 'deg)'">🌸</span>
      </div>

    </div>

    <div style="height: 160px;"></div>
  </div>

  <!-- MUNI flotante y botón chat en slot fixed -->
  <div slot="fixed" class="fixed-bottom">
    <div class="muni-float">
      <img src="assets/avatars/muni-avatar.png" class="muni-img" alt="Muni"/>
      <div class="muni-bubble">¡Registra cómo te sientes!</div>
    </div>
    <button class="chat-fab" (click)="navegarChat()">💬</button>
  </div>

</ion-content>
