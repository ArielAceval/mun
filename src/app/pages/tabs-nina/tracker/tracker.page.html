<ion-header [translucent]="false">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button>
        <ion-icon name="menu-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title class="mun-logo-title">MUN</ion-title>
    <ion-buttons slot="end">
      <ion-button class="notif-btn">
        <ion-icon name="notifications-outline" style="color:#2c3e7d;font-size:22px;"></ion-icon>
        <span class="notif-badge">1</span>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" style="--background:#fdfaf5;">
  <div class="tracker-wrapper">

    <h1 class="page-title">DIME DÓNDE TE DUELE</h1>

    <!-- Siluetas del cuerpo -->
    <div class="body-section">
      <div class="body-container">
        <div class="body-bg"></div>
        <span class="body-emoji">🧍‍♀️</span>
        <div class="pain-point pain-cabeza"></div>
        <div class="pain-point pain-vientre"></div>
      </div>
      <div class="body-container">
        <div class="body-bg body-bg-lavanda"></div>
        <span class="body-emoji">🚶‍♀️</span>
        <div class="pain-point pain-espalda"></div>
      </div>
    </div>

    <!-- Grid tipos de dolor + nivel -->
    <div class="dolor-grid-wrap">
      <div class="pain-grid">
        <button *ngFor="let p of painTypes"
          class="pain-card"
          [class.selected]="selectedPains.includes(p.label)"
          [style.background]="p.fondo"
          (click)="togglePain(p.label)">
          <span class="pain-emoji">{{ p.emoji }}</span>
          <span class="pain-label">{{ p.label }}</span>
        </button>
      </div>

      <div class="nivel-col">
        <label class="nivel-label">Nivel de Dolor</label>
        <div class="nivel-list">
          <button *ngFor="let l of dolorLevels"
            class="nivel-btn"
            [class.selected]="dolorLevel === l"
            (click)="selectDolorLevel(l)">
            {{ l }}
          </button>
        </div>
      </div>
    </div>

    <!-- Botón guardar -->
    <button class="guardar-btn" (click)="guardar()">Guardar registro</button>

  </div>
</ion-content>
